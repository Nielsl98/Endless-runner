<!doctype html><html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Endless Runner V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102030;font-family:Arial;color:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;z-index:5;pointer-events:none}
.box{background:#0009;padding:9px 12px;border-radius:10px;font-weight:bold}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#061018dd}
#panel{text-align:center;width:min(90%,420px);padding:28px}h1{font-size:40px}
button{border:0;border-radius:14px;padding:16px 30px;font-size:20px;font-weight:bold}
.hidden{display:none!important}#status{margin-top:15px;opacity:.7}
</style></head><body>
<div id="hud"><div class="box">⏱ <span id="timer">60</span></div><div class="box">👥 <span id="count">1</span> ⭐ <span id="score">0</span></div></div>
<div id="overlay"><div id="panel"><h1 id="title">ENDLESS RUNNER</h1><p id="message">Verzamel characters en klokken.<br>Vermijd alle obstakels.</p><button id="startBtn">START</button><div id="status"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{"use strict";
let scene,camera,renderer,player,followers=[],obstacles=[],items=[],world=[],running=false,last=0,spawn=0,clockSpawn=0,time=60,score=0,count=1,clocks=0,x=0,tx=0,z=2,tz=2,sx=0,sy=0;
const $=id=>document.getElementById(id),overlay=$("overlay"),start=$("startBtn"),hud=$("hud");
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x102030);scene.fog=new THREE.Fog(0x102030,25,110);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);camera.position.set(0,7,11);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));let l=new THREE.DirectionalLight(0xffffff,2);l.position.set(10,20,10);scene.add(l);
 let gm=new THREE.MeshStandardMaterial({color:0x263238}),lm=new THREE.MeshBasicMaterial({color:0x667788});
 for(let i=-5;i<100;i++){let g=new THREE.Mesh(new THREE.BoxGeometry(14,.25,5),gm);g.position.set(0,-1,-i*5);scene.add(g);world.push(g);let q=new THREE.Mesh(new THREE.BoxGeometry(.08,.03,4),lm);q.position.set(0,-.84,-i*5);scene.add(q);world.push(q)}
 addEventListener("resize",resize);addEventListener("keydown",e=>{if(!running)return;if(e.key==="ArrowLeft")move(-1,0);if(e.key==="ArrowRight")move(1,0);if(e.key==="ArrowUp")move(0,-1);if(e.key==="ArrowDown")move(0,1)});
 renderer.domElement.addEventListener("touchstart",e=>{if(running){sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY}},{passive:false});
 renderer.domElement.addEventListener("touchend",e=>{if(!running)return;e.preventDefault();let t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy>0?1:-1)},{passive:false});
 start.addEventListener("click",startGame);start.addEventListener("touchend",startGame,{passive:false});reset();requestAnimationFrame(loop);
}
function char(c){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.55),new THREE.MeshStandardMaterial({color:c}));b.position.y=.05;g.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),new THREE.MeshStandardMaterial({color:0xffd0a8}));h.position.y=.78;g.add(h);return g}
function reset(){followers.forEach(o=>scene.remove(o));obstacles.forEach(o=>scene.remove(o));items.forEach(o=>scene.remove(o));followers=[];obstacles=[];items=[];player=char(0x2ecc71);player.position.set(0,0,2);scene.add(player);x=tx=0;z=tz=2;time=60;score=0;count=1;clocks=0;spawn=.5;clockSpawn=2;hudUpdate()}
function startGame(e){e&&e.preventDefault();e&&e.stopPropagation();reset();running=true;overlay.classList.add("hidden");hud.style.display="flex";last=performance.now()}
function over(reason){if(!running)return;running=false;hud.style.display="none";overlay.classList.remove("hidden");$("title").textContent="GAME OVER";$("message").innerHTML="Score: <b>"+score+"</b><br>Characters: <b>"+count+"</b><br>Klokken: <b>"+clocks+"</b>";$("status").textContent=reason;start.textContent="OPNIEUW SPELEN"}
function move(dx,dz){tx=Math.max(-4.4,Math.min(4.4,tx+dx*2.2));tz=Math.max(-1,Math.min(5,tz+dz*2.2))}
function spd(){return count<5?7:count<10?7.7:count<15?8.4:count<20?9.1:count<30?10.15:count<40?10.85:11.55}
function spawnChar(){let o=char(0xf1c40f);o.position.set((Math.floor(Math.random()*5)-2)*2.2,0,-75);o.userData.type="char";scene.add(o);items.push(o)}
function spawnClock(){let o=new THREE.Mesh(new THREE.TorusGeometry(.42,.12,10,20),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0x664400}));o.rotation.x=Math.PI/2;o.position.set((Math.floor(Math.random()*5)-2)*2.2,0,-75);o.userData.type="clock";scene.add(o);items.push(o)}
function spawnObstacle(){let o=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.2,1.2),new THREE.MeshStandardMaterial({color:0xe74c3c}));o.position.set((Math.floor(Math.random()*5)-2)*2.2,.1,-75);scene.add(o);obstacles.push(o)}
function hudUpdate(){$("timer").textContent=Math.max(0,Math.ceil(time));$("count").textContent=count;$("score").textContent=score}
function hit(a,b,d){return a.position.distanceTo(b.position)<d}
function collect(o){if(o.userData.type==="char"){count++;score+=100;let f=char(0x3498db);scene.add(f);followers.push(f)}else{clocks++;score+=250;time=Math.min(60,time+5)}scene.remove(o);let i=items.indexOf(o);if(i>=0)items.splice(i,1)}
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(running){time-=dt;if(time<=0){time=0;hudUpdate();over("De tijd is op.")}else{let s=spd();x+=(tx-x)*Math.min(1,dt*12);z+=(tz-z)*Math.min(1,dt*12);player.position.x=x;player.position.z=z;let dz=s*dt;world.forEach(o=>{o.position.z+=dz;if(o.position.z>12)o.position.z-=500});obstacles.forEach(o=>o.position.z+=dz);items.forEach(o=>o.position.z+=dz);
 spawn-=dt;if(spawn<=0){spawn=.65+Math.random()*.45;Math.random()<.52?spawnChar():spawnObstacle()}clockSpawn-=dt;if(clockSpawn<=0){clockSpawn=2.8+Math.random()*2.2;if(Math.random()<.7)spawnClock()}
 for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];if(o.position.z>15){scene.remove(o);obstacles.splice(i,1);continue}if(hit(player,o,1.45)){over("Je raakte een obstakel.");break}}
 if(running)for(let i=items.length-1;i>=0;i--){let o=items[i];if(o.position.z>15){scene.remove(o);items.splice(i,1);continue}if(hit(player,o,1.25))collect(o)}
 for(let i=0;i<followers.length;i++){let p=(i?followers[i-1]:player).position.clone();p.z+=1.05;followers[i].position.lerp(p,.18)}
 camera.position.x+=(player.position.x*.35-camera.position.x)*dt*5;camera.position.z+=(player.position.z+9-camera.position.z)*dt*5;camera.lookAt(player.position.x,0,player.position.z-10);hudUpdate()}}renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
init();
})();
</script></body></html>
