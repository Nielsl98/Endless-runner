<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Endless Runner V3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102030;font-family:Arial,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;z-index:5;pointer-events:none}
.box{background:#0009;padding:9px 12px;border-radius:10px;font-weight:700}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#061018dd}
#panel{text-align:center;width:min(90%,430px);padding:28px}
h1{font-size:40px;margin:0 0 12px}
p{line-height:1.5;opacity:.9}
button{border:0;border-radius:14px;padding:16px 30px;font-size:20px;font-weight:700}
.hidden{display:none!important}
#status{margin-top:15px;opacity:.7}
</style>
</head>
<body>
<div id="hud"><div class="box">⏱ <span id="timer">60</span></div><div class="box">👥 <span id="count">1</span> ⭐ <span id="score">0</span></div></div>
<div id="overlay"><div id="panel">
<h1 id="title">ENDLESS RUNNER</h1>
<p id="message">Verzamel characters en klokken.<br>Beweeg links, rechts, vooruit en achteruit.<br>Vermijd alle obstakels.</p>
<button id="startBtn">START</button><div id="status"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{"use strict";
let scene,camera,renderer,player;
let followers=[],obstacles=[],items=[],ground=[];
let running=false,last=0,spawnT=0,clockT=0;
let time=60,score=0,count=1,clocks=0;
let targetX=0,targetZ=4,facing=0,targetFacing=0;
let sx=0,sy=0;
const overlay=document.getElementById("overlay"),startBtn=document.getElementById("startBtn");
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x102030);scene.fog=new THREE.Fog(0x102030,35,125);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);camera.position.set(0,8,12);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2));const l=new THREE.DirectionalLight(0xffffff,2);l.position.set(10,20,10);scene.add(l);
 createGround();
 addEventListener("resize",resize);addEventListener("keydown",keyMove);
 renderer.domElement.addEventListener("touchstart",e=>{if(running){const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY}},{passive:false});
 renderer.domElement.addEventListener("touchend",e=>{if(!running)return;e.preventDefault();const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1)},{passive:false});
 startBtn.addEventListener("click",startGame);startBtn.addEventListener("touchend",startGame,{passive:false});
 reset();requestAnimationFrame(loop);
}
function createGround(){
 const mat=new THREE.MeshStandardMaterial({color:0x263238}),lm=new THREE.MeshBasicMaterial({color:0x4e626e});
 const g=new THREE.Mesh(new THREE.BoxGeometry(32,.3,180),mat);g.position.set(0,-1,-70);scene.add(g);ground.push(g);
 for(let x=-15;x<=15;x+=3){const q=new THREE.Mesh(new THREE.BoxGeometry(.035,.025,180),lm);q.position.set(x,-.83,-70);scene.add(q);ground.push(q)}
 for(let z=-160;z<=20;z+=5){const q=new THREE.Mesh(new THREE.BoxGeometry(32,.025,.035),lm);q.position.set(0,-.82,z);scene.add(q);ground.push(q)}
}
function makeCharacter(color){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.75,1.05,.55),new THREE.MeshStandardMaterial({color}));body.position.y=.05;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.38,20,14),new THREE.MeshStandardMaterial({color:0xffd0a8}));head.position.y=.78;g.add(head);
 const nose=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),new THREE.MeshStandardMaterial({color:0xd49a78}));nose.position.set(0,.8,.35);g.add(nose);
 return g;
}
function reset(){
 followers.forEach(o=>scene.remove(o));obstacles.forEach(o=>scene.remove(o));items.forEach(o=>scene.remove(o));
 followers=[];obstacles=[];items=[];
 player=makeCharacter(0x2ecc71);player.position.set(0,0,4);player.rotation.y=0;scene.add(player);
 targetX=0;targetZ=4;facing=0;targetFacing=0;time=60;score=0;count=1;clocks=0;spawnT=.8;clockT=2.5;updateHud();
}
function startGame(e){if(e){e.preventDefault();e.stopPropagation()}reset();running=true;overlay.classList.add("hidden");document.getElementById("hud").style.display="flex";last=performance.now()}
function finish(reason){if(!running)return;running=false;document.getElementById("hud").style.display="none";overlay.classList.remove("hidden");document.getElementById("title").textContent="GAME OVER";document.getElementById("message").innerHTML="Score: <b>"+score+"</b><br>Characters: <b>"+count+"</b><br>Klokken: <b>"+clocks+"</b>";document.getElementById("status").textContent=reason;startBtn.textContent="OPNIEUW SPELEN"}
function keyMove(e){if(!running)return;if(e.key==="ArrowLeft")move(-1,0);if(e.key==="ArrowRight")move(1,0);if(e.key==="ArrowUp")move(0,-1);if(e.key==="ArrowDown")move(0,1)}
function move(dx,dz){
 targetX=Math.max(-14,Math.min(14,targetX+dx*3));targetZ=Math.max(-65,Math.min(8,targetZ+dz*3));
 if(dx<0)targetFacing=-Math.PI/2;if(dx>0)targetFacing=Math.PI/2;if(dz<0)targetFacing=0;if(dz>0)targetFacing=Math.PI;
}
function randomX(){return -13+Math.random()*26}function randomZ(){return -80+Math.random()*35}
function spawnCharacter(){const o=makeCharacter(0xf1c40f);o.position.set(randomX(),0,randomZ());o.userData.type="character";scene.add(o);items.push(o)}
function spawnClock(){const o=new THREE.Mesh(new THREE.TorusGeometry(.42,.12,10,20),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0x664400}));o.rotation.x=Math.PI/2;o.position.set(randomX(),.4,randomZ());o.userData.type="clock";scene.add(o);items.push(o)}
function spawnObstacle(){const o=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.2,1.5),new THREE.MeshStandardMaterial({color:0xe74c3c}));o.position.set(randomX(),.1,randomZ());scene.add(o);obstacles.push(o)}
function updateHud(){document.getElementById("timer").textContent=Math.max(0,Math.ceil(time));document.getElementById("count").textContent=count;document.getElementById("score").textContent=score}
function distanceXZ(a,b){const dx=a.position.x-b.position.x,dz=a.position.z-b.position.z;return Math.sqrt(dx*dx+dz*dz)}
function collect(o){
 if(o.userData.type==="character"){count++;score+=100;const f=makeCharacter(0x3498db);f.position.copy(player.position);f.rotation.y=player.rotation.y;scene.add(f);followers.push(f)}
 else{clocks++;score+=250;time=Math.min(60,time+5)}
 scene.remove(o);const i=items.indexOf(o);if(i>=0)items.splice(i,1)
}
function updateFollowers(){for(let i=0;i<followers.length;i++){const prev=i===0?player:followers[i-1],p=prev.position.clone();p.z+=1.05;followers[i].position.lerp(p,.16);followers[i].rotation.y=prev.rotation.y}}
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(running){time-=dt;if(time<=0){time=0;updateHud();finish("De tijd is op")}else{
  const speed=count<5?7:count<10?7.7:count<15?8.4:count<20?9.1:count<30?10.15:count<40?10.85:11.55;
  player.position.x+=(targetX-player.position.x)*Math.min(1,dt*10);player.position.z+=(targetZ-player.position.z)*Math.min(1,dt*10);
  let d=targetFacing-facing;d=Math.atan2(Math.sin(d),Math.cos(d));facing+=d*Math.min(1,dt*12);player.rotation.y=facing;
  ground.forEach(o=>{if(o.position.z>30)o.position.z-=180;if(o.position.z<-160)o.position.z+=180});
  const dz=speed*dt;obstacles.forEach(o=>o.position.z+=dz);items.forEach(o=>o.position.z+=dz);
  spawnT-=dt;if(spawnT<=0){spawnT=.55+Math.random()*.55;Math.random()<.52?spawnCharacter():spawnObstacle()}
  clockT-=dt;if(clockT<=0){clockT=2.5+Math.random()*2.5;if(Math.random()<.75)spawnClock()}
  for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];if(o.position.z>25||Math.abs(o.position.x-player.position.x)>18){scene.remove(o);obstacles.splice(i,1);continue}if(distanceXZ(player,o)<1.45){finish("Je raakte een obstakel.");break}}
  if(running)for(let i=items.length-1;i>=0;i--){const o=items[i];if(o.position.z>25||Math.abs(o.position.x-player.position.x)>18){scene.remove(o);items.splice(i,1);continue}if(distanceXZ(player,o)<1.25)collect(o)}
  updateFollowers();camera.position.x+=(player.position.x*.35-camera.position.x)*dt*5;camera.position.z+=(player.position.z+10-camera.position.z)*dt*5;camera.lookAt(player.position.x,0,player.position.z-8);updateHud();
 }}renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
init();
})();
</script></body></html>
